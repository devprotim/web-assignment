services:
  - type: web
    runtime: docker
    name: chat-app
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        fromService:
          type: web
          name: chat-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chat-cache
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_URL
        sync: false
      - key: NSFW_THRESHOLD_PORN
        value: "0.60"
      - key: NSFW_THRESHOLD_HENTAI
        value: "0.60"
      - key: NSFW_THRESHOLD_SEXY
        value: "0.85"
      - key: NSFW_THRESHOLD_COMBINED
        value: "0.75"
      - key: TENOR_API_KEY
        sync: false

  - type: keyvalue
    name: chat-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: chat-db
    plan: free
    postgresMajorVersion: "17"
